name: AI role task
on:
  schedule:
    # 09:00 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      role:
        description: Role to run (review produces a report; develop/fix propose a draft PR)
        required: true
        type: choice
        options: [develop, review, fix]
      task:
        description: Concrete bounded task or reproduction (max 4000 characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-role-${{ github.repository }}
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AI_AGENTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      has_changes: ${{ steps.proposal.outputs.has_changes }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record reviewed base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request a bounded proposal
        id: proposal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AI_ROLE: ${{ inputs.role || 'fix' }}
          AI_MAINTENANCE: ${{ github.event_name == 'schedule' }}
          AI_TASK: >-
            ${{ inputs.task || 'Daily maintenance: choose one unfinished gameplay improvement documented in docs/Design/Gameplay-Upgrade-2026-11-17.md or one reproducible stability or defensive security regression in the supplied source. Make a bounded correction with a NEW behavioral regression test. Preserve existing tests, game balance, and the change allowlist. Return no changes when evidence is insufficient.' }}
        run: python3 .github/scripts/ai_propose.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-proposal
          path: /tmp/ai-proposal/
          retention-days: 7
  validate:
    needs: propose
    if: needs.propose.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job never receives the API secret or a repository-write token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-proposal
          path: /tmp/ai-proposal
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: Server
      - name: Apply guarded proposal
        run: |
          python3 .github/scripts/ai_changes.py /tmp/ai-proposal/proposal.json --stage ${{ github.event_name == 'schedule' && '--require-regression' || '' }}
          git diff --cached --binary > /tmp/proposed.patch
          git diff --cached --check
      - name: Verify the scheduled regression on the baseline and staged proposal
        if: github.event_name == 'schedule'
        timeout-minutes: 5
        run: python3 .github/scripts/verify_scheduled_regression.py
      - run: python3 scripts/check-quality-gates.py --validate
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run all quality gates on the proposed change
        run: python3 scripts/check-quality-gates.py --all
      - name: Ensure validation did not rewrite proposed source
        run: |
          git diff --exit-code
          git diff --cached --binary > /tmp/tested.patch
          cmp /tmp/proposed.patch /tmp/tested.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-validation-browser-evidence
          retention-days: 14
          path: |
            /tmp/crazyacade-quality/
            /tmp/crazyacade-quality-browsers/
            /tmp/crazyacade-input/
            /tmp/poppop85-load.json
            /tmp/poppop-game-shell/
            /tmp/poppop-member-account/
            /tmp/crazyacade-upgrade/browser/
            /tmp/poppop-poc-*.png
            /tmp/poppop-service-*.png
            /tmp/poppop-practice-*.png
            /tmp/poppop-relay-*.png
            /tmp/poppop-reconnect-*.png
            /tmp/poppop-storage-*.png
            /tmp/poppop-audio-*.png
            /tmp/poppop-audio-*.wav
          if-no-files-found: ignore
  draft-pr:
    needs: [propose, validate]
    if: needs.validate.result == 'success' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-proposal
          path: /tmp/ai-proposal
      # Fresh job reapplies the original proposal; proposed code is never executed here.
      - name: Prepare reviewed change
        env:
          AI_ROLE: ${{ inputs.role || 'fix' }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 .github/scripts/ai_changes.py /tmp/ai-proposal/proposal.json --stage
          git config core.hooksPath /dev/null
          git config user.name 'Pop Pop Arena AI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "ai/$AI_ROLE-$RUN_ID-$ATTEMPT"
          git diff --cached --check
          git commit -m "AI $AI_ROLE proposal ($RUN_ID)"
      - name: Publish draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_ROLE: ${{ inputs.role || 'fix' }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "ai/$AI_ROLE-$RUN_ID-$ATTEMPT"
          echo "" >> /tmp/ai-proposal/report.md
          echo "The full quality gate passed on this proposal, including the Unity JS bridge tests. Human review is required before merging." >> /tmp/ai-proposal/report.md
          gh pr create --draft --base main --head "ai/$AI_ROLE-$RUN_ID-$ATTEMPT" --title "AI $AI_ROLE proposal ($RUN_ID)" --body-file /tmp/ai-proposal/report.md

  daily-publish:
    needs: [propose, validate]
    if: github.event_name == 'schedule' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-proposal
          path: /tmp/ai-proposal
      - name: Require deployment verification configuration before changing main
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: python3 .github/scripts/daily_publish.py --preflight
      - name: Reapply validated proposal without executing proposed source
        run: |
          set -euo pipefail
          python3 .github/scripts/ai_changes.py /tmp/ai-proposal/proposal.json --stage --require-regression
          git diff --cached --check
          git config core.hooksPath /dev/null
          git config user.name 'Pop Pop Arena AI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily verified gameplay maintenance ($GITHUB_RUN_ID)"
      - name: Publish only while main still equals the validated base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BASE: ${{ needs.propose.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/daily_publish.py --check-base "$EXPECTED_BASE"
          gh auth setup-git
          # A concurrent newer main causes an ordinary non-fast-forward rejection.
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/main
      - name: Dispatch exact-commit CI and verify the matching Render deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: python3 .github/scripts/daily_publish.py --sha "$(git rev-parse HEAD)"
