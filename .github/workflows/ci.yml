name: CI
on: push
permissions:
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - run: 44921769358
            sha: 5851b635a2a79dbf85229ac28564ca1d600c6fb1
          - run: 44920008908
            sha: 607d72839015025b0a49180379ac21aaba55ad1d
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: quality-evidence-push-${{ matrix.sha }}
          path: evidence
      - name: Identify the failing scenario and assertion
        env:
          REVIEW_RUN: ${{ matrix.run }}
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          evidence = Path('evidence')
          source = os.environ['REVIEW_RUN']
          def annotate(text):
              safe = str(text).replace('%', '%25').replace('\r', ' ').replace('\n',' ')[:600]
              print(f'::notice title=QA result {source}::{safe}')
          report = json.loads(next(evidence.rglob('crazyacade-quality/report.json')).read_text())
          annotate(report['quality']['missingOrFailedChecks'])
          if 'game-shell' in report['quality']['missingOrFailedChecks']:
              cases = json.loads(next(evidence.rglob('poppop-game-shell/results.json')).read_text())
              for case in cases:
                  if case['status'] != 'passed':
                      annotate(case['scenario'])
                      error = case.get('error','').splitlines()
                      if error:
                          annotate(error[0])
                      lines = case.get('traceback','').splitlines()
                      for i, line in enumerate(lines):
                          if '/scripts/game-shell-smoke.py' in line and i + 1 < len(lines):
                              annotate(line.strip() + ' ' + lines[i+1].strip())
          if 'browser-compatibility' in report['quality']['missingOrFailedChecks']:
              for path in evidence.rglob('crazyacade-quality-browsers/**/results.json'):
                  for result in json.loads(path.read_text()):
                      if result.get('status') == 'failed':
                          annotate(str(path.relative_to(evidence)) + ' ' + result.get('scenario',result.get('browser','')) + ' ' + ' '.join(result.get('error','').splitlines()[:9]))
                          for i,line in enumerate(result.get('traceback','').splitlines()):
                              if 'quality-browser-smoke' in line:
                                  annotate(line.strip())
          if 'game-shell' in report['quality']['missingOrFailedChecks']:
              measures = json.loads(next(evidence.rglob('poppop-game-shell/measurements.json')).read_text())
              for name in ['844x390-native-escape','844x390-FAILURE']:
                  if name in measures:
                      value=measures[name]
                      annotate(name + ' ' + str({k: value.get(k) for k in ['scene','fullscreen','bodyFocused','savedFocus','focusPressed']}))
          PYTHON
