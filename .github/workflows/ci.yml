name: CI
on:
  # Every branch push is checked. PR runs validate GitHub's synthetic merge ref,
  # which can differ from the pushed branch HEAD; both are intentional coverage.
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Do not cancel an older commit's quality check when another commit arrives.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: Server
      - name: Validate quality coverage and enforceable budgets
        run: python3 scripts/check-quality-gates.py --validate
      - name: Verify real email confirmation and two-member match storage
        run: bash scripts/test-supabase-auth.sh
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run all quality gates and calculate the fresh engineering score
        id: quality
        run: |
          touch "$RUNNER_TEMP/quality-gate-start"
          python3 scripts/check-quality-gates.py --all
      - name: Summarize the engineering quality gate
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.quality.outcome }}
        run: |
          report=/tmp/crazyacade-quality/report.json
          start="$RUNNER_TEMP/quality-gate-start"
          if [[ -f "$start" && "$report" -nt "$start" ]] && jq -er --arg sha "$GITHUB_SHA" --arg outcome "$GATE_OUTCOME" '
            select(.revision == $sha and .mode == "full" and .complete == true)
            | select(($outcome == "success" and .quality.passed == true) or ($outcome == "failure" and .quality.passed == false))
            | "Full engineering gate **\(if .quality.passed then "passed" else "failed" end)** · **\(.quality.score)/\(.quality.maximum)** for `\(.revision)`."
              + (.quality.missingOrFailedChecks | if length > 0 then "\n\nMissing or failed checks: \(join(", "))." else "" end)
          ' "$report" >> "$GITHUB_STEP_SUMMARY"; then
            if [[ "$GATE_OUTCOME" == failure ]]; then
              jq -r '"::error title=Engineering quality gate::Score \(.quality.score)/\(.quality.maximum). Failed or missing checks: \(.quality.missingOrFailedChecks | join(", "))."' "$report"
            else
              jq -r '"::notice title=Engineering quality gate::Score \(.quality.score)/\(.quality.maximum). All \(.results | length) checks passed."' "$report"
            fi
            exit 0
          fi
          printf 'Full engineering gate score unavailable for `%s` (gate step %s).\n' "$GITHUB_SHA" "$GATE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Save quality report, command logs and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.event_name }}-${{ github.sha }}
          retention-days: 14
          path: |
            /tmp/crazyacade-quality/
            /tmp/crazyacade-quality-browsers/
            /tmp/crazyacade-input/
            /tmp/poppop-game-shell/
            /tmp/poppop-member-account/
            /tmp/poppop85-load.json
            /tmp/crazyacade-upgrade/browser/
          if-no-files-found: warn
