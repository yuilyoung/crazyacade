name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: Server
      - run: npm test
        working-directory: Server
      - run: node --test Assets/Tests/*.test.cjs
      - name: Check single-step Supabase setup matches migrations
        run: python3 scripts/build-supabase-setup.py --check
      - name: Verify ranking migrations in isolated PostgreSQL
        run: python3 scripts/test-rankings-db.py
      - name: Validate AI change guard
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      # Screen-based acceptance replaces the historical single-page UI scripts.
      # Engine rules, reconnect, ranked/party logic and audio retain their Node tests.
      - name: Verify game screens, eight-player entry, fullscreen and touch controls
        run: python3 scripts/game-shell-smoke.py
      - name: Verify registered account UI and private records with a local provider fixture
        run: python3 scripts/member-account-smoke.py
      - name: Measure bounded 64-client runtime and cleanup
        run: node scripts/load85-smoke.mjs --output /tmp/poppop85-load.json
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            /tmp/poppop-game-shell/
            /tmp/poppop-member-account/
            /tmp/poppop85-load.json
          if-no-files-found: ignore
